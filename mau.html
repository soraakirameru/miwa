<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You 🌸</title>
    <link rel="stylesheet" href="css/main.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0a0a0a;
            font-family: 'Poppins', sans-serif, Arial;
            overflow: hidden;
            position: relative;
        }

        /* Styling Kepingan Salju Putih */
        .snowflake {
            position: absolute;
            top: -20px;
            color: #ffffff;
            opacity: 0.9;
            text-shadow: 0 0 5px #ffffff, 0 0 10px rgba(255, 255, 255, 0.8);
            animation: fall linear infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.9;
            }
            100% {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0.2;
            }
        }

        /* Container Utama */
        .card-container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 16px 14px;
            border-radius: 20px;
            text-align: center;
            max-width: 280px;
            width: 75%;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 10;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }

        .sticker {
            width: 85px;
            height: auto;
            margin-bottom: 6px;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        /* Wadah Lirik Lagu */
        .lirik-container {
            font-size: 11px;
            font-style: italic;
            color: #ffffff;
            padding: 4px 8px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-weight: bold;
            text-align: center;
        }

        /* Area Teks Pesan */
        .penjelasan-box {
            color: #030303;
            font-size: 12px;
            line-height: 1.5;
            margin-bottom: 12px;
            font-weight: 500;
            max-height: 130px;
            overflow-y: auto;
            text-align: left;
            padding: 8px 10px;
            background: #fff5f8;
            border-radius: 12px;
            border: 1px dashed #abaaaa;
        }

        /* Scrollbar Styling */
        .penjelasan-box::-webkit-scrollbar {
            width: 4px;
        }
        .penjelasan-box::-webkit-scrollbar-thumb {
            background-color: #a1a1a1;
            border-radius: 10px;
        }

        /* Cursor Mengetik */
        .cursor {
            display: inline-block;
            width: 2px;
            height: 13px;
            background-color: #878787;
            animation: blink 0.7s infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Group Tombol */
        .button-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            position: relative;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease, visibility 0.5s ease;
            margin-top: 5px;
            flex-wrap: wrap;
        }

        .button-group.show {
            opacity: 1;
            visibility: visible;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease-out;
            outline: none;
        }

        .btn-mau {
            background-color: #969393;
            color: white;
            box-shadow: 0 4px 10px rgba(202, 202, 202, 0.4);
        }

        .btn-mau:active {
            transform: scale(0.95);
        }

        .btn-ngga {
            background-color: #f0f0f0;
            color: #7c7b7c;
        }
    </style>
</head>
<body>

    <!-- TAG MUSIK LOKAL (Sudah dibersihkan dari karakter error) -->
    <audio id="myAudio" src="lagumerry.mp3" preload="auto"></audio>

    <div class="card-container">
        <!-- Stiker -->
        <img src="https://i.pinimg.com/736x/63/78/0a/63780aa64a274934c2b3d4c007909a25.jpg" alt="Stiker Cute" class="sticker" id="stikerImg">

        <!-- Tempat Lirik Lagu -->
        <div class="lirik-container" id="boxLirik">
            - 🎵 -
        </div>

        <!-- Tempat Teks Pesan -->
        <div class="penjelasan-box" id="scrollBox">
            <span id="teksPesan"></span><span class="cursor" id="cursor"></span>
        </div>

        <!-- Opsi Tombol -->
        <div class="button-group" id="buttonGroup">
            <button class="btn btn-mau" id="btnMau" onclick="pilihMau()">Masih, yu </button>
            <button class="btn btn-ngga" id="btnNggak">ga ada, maaf </button>
        </div>
    </div>

    <script>
    const pesan = "Halo maniss⁉️ \n\nAku mau jujur sama kamu, akhir-akhir ini aku sadar kalau ternyata perasaanku ke kamu masih sama. Aku tahu setelah semua yang aku lakuin, mungkin kamu udah banyak berubah dan mungkin kamu juga udah ga bisa percaya sama aku seperti dulu. Aku sadar aku pernah nyakitin kamu dan mungkin sampai sekarang masih ada rasa sakit yang kamu simpan. Aku ga mau membenarkan kesalahanku atau maksa kamu buat kembali, aku cuma ga mau terus pura-pura kalau aku udah ga punya rasa apa-apa. Aku masih sayang sama kamu, dan aku ingin tau apakah masih ada harapan buat kita ke depannya?";

    const daftarLirik = [
        { waktu: 0, lirik: "🎵 You know it's true " },
        { waktu: 4, lirik: "🎵 That i miss you" },
        { waktu: 9, lirik: "🎵 You know it's true " },
        { waktu: 13, lirik: "🎵 So what if I call?" },
        { waktu: 18, lirik: "🎵 And you pick up the phone?" },
        { waktu: 22, lirik: "🎵 And I use this holiday to make my way to your coast" },
        { waktu: 32, lirik: "🎵 Oh, what if you're lonely?" },
        { waktu: 36.5, lirik: "🎵 And you know I am too?" },
        { waktu: 41, lirik: "🎵 And I get the chance to say, 'let's get back together, I miss you'" },
        { waktu: 50, lirik: "🎵 I miss you" }
    ];

    const elemenTeks = document.getElementById('teksPesan');
    const elemenCursor = document.getElementById('cursor');
    const scrollBox = document.getElementById('scrollBox');
    const buttonGroup = document.getElementById('buttonGroup');
    const btnMau = document.getElementById('btnMau');
    const btnNggak = document.getElementById('btnNggak');
    const audio = document.getElementById('myAudio');
    const boxLirik = document.getElementById('boxLirik');

    let index = 0;
    const kecepatanKetik = 40;

    let paddingV = 8;
    let paddingH = 16;
    let fontSize = 12;

    let jumlahKlikNgga = 0;

    // LOGIKA AUDIO INTERAKTIF (Dipasang langsung ke Event Listener Document)
    function aktifkanAudio() {
        const mainkan = () => {
            audio.play().then(() => {
                // Hapus pemicu setelah audio berhasil bunyi
                document.removeEventListener('click', mainkan);
                document.removeEventListener('touchstart', mainkan);
                document.removeEventListener('pointerdown', mainkan);
            }).catch(err => console.log("Menunggu sentuhan user..."));
        };

        // Pasang event pemicu di seluruh layar
        document.addEventListener('click', mainkan);
        document.addEventListener('touchstart', mainkan);
        document.addEventListener('pointerdown', mainkan);
    }

    function ketikTeks() {
        if (index < pesan.length) {
            let char = pesan.charAt(index);
            if (char === '\n') {
                elemenTeks.innerHTML += '<br>';
            } else {
                elemenTeks.innerHTML += char;
            }
            index++;
            
            scrollBox.scrollTop = scrollBox.scrollHeight;
            setTimeout(ketikTeks, kecepatanKetik);
        } else {
            elemenCursor.style.display = 'none';
            buttonGroup.classList.add('show');
        }
    }

    // Sinkronisasi Lirik
    audio.addEventListener('timeupdate', () => {
        const waktuSekarang = audio.currentTime;
        for (let i = daftarLirik.length - 1; i >= 0; i--) {
            if (waktuSekarang >= daftarLirik[i].waktu) {
                boxLirik.innerText = daftarLirik[i].lirik;
                break;
            }
        }
    });

    // LOGIKA TOMBOL NGGA (Pindah acak 2x, klik ke-3 ke tolak.html)
    btnNggak.addEventListener('click', (e) => {
        jumlahKlikNgga++;

        if (jumlahKlikNgga < 3) {
            e.preventDefault();

            // 1. Membesarkan tombol Mau
            paddingV += 6;
            paddingH += 12;
            fontSize += 2;
            btnMau.style.padding = `${paddingV}px ${paddingH}px`;
            btnMau.style.fontSize = `${fontSize}px`;

            // 2. Memindahkan posisi tombol Ngga secara acak
            const randomX = Math.floor(Math.random() * 120) - 60;
            const randomY = Math.floor(Math.random() * 80) - 40;
            
            btnNggak.style.position = 'relative';
            btnNggak.style.transform = `translate(${randomX}px, ${randomY}px)`;
        } else {
            // Klik ke-3: Pindah ke halaman tolak.html
            window.location.href = "tolak.html";
        }
    });

    function pilihMau() {
        window.location.href = "maunolak.html";
    }

    // Efek Salju Putih
    function buatEfekSalju() {
        const simbols = ['❄', '❅', '❆', '•', '✧'];
        setInterval(() => {
            const flake = document.createElement('div');
            flake.classList.add('snowflake');
            flake.innerText = simbols[Math.floor(Math.random() * simbols.length)];
            flake.style.left = Math.random() * 100 + 'vw';
            
            const durasi = Math.random() * 3 + 3;
            flake.style.animationDuration = durasi + 's';
            flake.style.fontSize = Math.random() * 10 + 12 + 'px';
            
            document.body.appendChild(flake);

            setTimeout(() => { flake.remove(); }, durasi * 1000);
        }, 200);
    }

    window.onload = () => {
        ketikTeks();
        buatEfekSalju();
        aktifkanAudio(); // Menyiapkan pemicu audio saat sentuhan pertama
    };
    </script>
</body>
</html>
