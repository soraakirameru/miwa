    <!-- Script Tombol Kabur -->
    <script>
        const btnGamau = document.getElementById('btnGamau');

        function moveButton(e) {
            if (e) e.preventDefault();

            if (btnGamau.parentElement !== document.body) {
                document.body.appendChild(btnGamau);
            }

            const padding = 20;
            const maxX = window.innerWidth - btnGamau.offsetWidth - padding;
            const maxY = window.innerHeight - btnGamau.offsetHeight - padding;

            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            btnGamau.style.position = 'fixed';
            btnGamau.style.left = `${randomX}px`;
            btnGamau.style.top = `${randomY}px`;
            btnGamau.style.zIndex = '9999';
        }

        btnGamau.addEventListener('mouseover', moveButton);
        btnGamau.addEventListener('touchstart', moveButton, { passive: false });
        btnGamau.addEventListener('pointerdown', moveButton);
        btnGamau.addEventListener('click', moveButton);
    </script>
